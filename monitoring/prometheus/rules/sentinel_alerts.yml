
# ============================================================
# SENTINEL OBSERVABILITY - ALERTAS OPERATIVAS
# ============================================================

groups:
  - name: sentinel_operational_alerts
    interval: 15s

    rules:

      # P1 - Backend no disponible
      - alert: BackendUnavailable
        expr: up{job="sentinel-backend"} == 0
        for: 2m
        labels:
          severity: critical
          priority: P1
          service: sentinel-backend
        annotations:
          summary: "Backend Sentinel no disponible"
          description: "Prometheus no puede recopilar las métricas del backend durante 2 minutos."

      # P1 - Tasa elevada de errores HTTP 5xx
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(sentinel_http_requests_total{endpoint="/predict",status=~"5.."}[5m]))
            or vector(0)
          )
          /
          clamp_min(
            sum(rate(sentinel_http_requests_total{endpoint="/predict"}[5m])),
            0.000001
          ) > 0.05
          and
          sum(increase(sentinel_http_requests_total{endpoint="/predict"}[5m])) >= 20
        for: 5m
        labels:
          severity: critical
          priority: P1
          service: sentinel-backend
        annotations:
          summary: "Tasa elevada de errores HTTP 5xx"
          description: "Más del 5% de solicitudes de predicción presentan errores de servidor."

      # P2 - Latencia elevada
      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(
                sentinel_http_request_duration_seconds_bucket{
                  endpoint="/predict"
                }[5m]
              )
            )
          ) > 0.5
          and
          sum(increase(sentinel_http_requests_total{endpoint="/predict"}[5m])) >= 20
        for: 5m
        labels:
          severity: warning
          priority: P2
          service: sentinel-backend
        annotations:
          summary: "Latencia elevada en Sentinel"
          description: "La latencia p95 supera 500 ms durante 5 minutos."
