# ============================================================
# SENTINEL OBSERVABILITY - PROMETHEUS
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml  

scrape_configs:

  # Métricas del propio Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Métricas del backend Sentinel
  - job_name: "sentinel-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]