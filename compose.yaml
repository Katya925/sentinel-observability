# ============================================================
# PROYECTO SENTINEL
# FASE V - INTEGRACIÓN CON DOCKER COMPOSE
# ============================================================

services:

  # Backend: API FastAPI y modelo ML
  backend:
    image: sentinel-backend:v1
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8000:8000"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    environment:
      OTEL_SERVICE_NAME: sentinel-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      SENTINEL_SIMULATE_LATENCY_SECONDS: "0"


  # Frontend: interfaz Streamlit
  frontend:
    image: sentinel-frontend:v1
    build:
      context: .
      dockerfile: frontend/Dockerfile

    ports:
      - "127.0.0.1:8501:8501"

    environment:
      API_URL: http://backend:8000

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

  # ==========================================================
  # PROMETHEUS - RECOPILACIÓN DE MÉTRICAS
  # ==========================================================

  prometheus:
    image: prom/prometheus:v3.5.0

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped


  # ==========================================================
  # GRAFANA - DASHBOARDS OPERATIVOS
  # ==========================================================

  grafana:
    image: grafana/grafana:12.1.0

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped

  
  # ==========================================================
  # TEMPO - ALMACENAMIENTO DE TRAZAS
  # ==========================================================
  tempo:
    image: grafana/tempo:2.7.2

    command:
      - "-config.file=/etc/tempo.yaml"

    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

    restart: unless-stopped


volumes:
  grafana_data:
  tempo_data: